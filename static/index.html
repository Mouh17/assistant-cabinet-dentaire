<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cabinet Dentaire Belle Sourire — Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --fond: #F7F5F0;
    --carte: #FFFFFF;
    --menthe: #2F9E8F;
    --menthe-sombre: #24796D;
    --texte: #23282B;
    --gris-texte: #767D80;
    --ligne: #E6E2D9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fond);
    color: var(--texte);
    font-family: 'Inter', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--ligne);
    background: var(--carte);
  }
  header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
    color: var(--texte);
  }
  header h1 span { color: var(--menthe); }
  header p {
    margin: 0;
    color: var(--gris-texte);
    font-size: 0.9rem;
  }
  #fil {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  .bulle {
    max-width: 82%;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 0.95rem;
    white-space: pre-wrap;
  }
  .utilisateur {
    align-self: flex-end;
    background: var(--menthe);
    color: #FFFFFF;
    font-weight: 500;
    border-bottom-right-radius: 4px;
  }
  .assistant {
    align-self: flex-start;
    background: var(--carte);
    border: 1px solid var(--ligne);
    box-shadow: 0 1px 2px rgba(35, 40, 43, 0.04);
    border-bottom-left-radius: 4px;
  }
  .sources {
    display: block;
    margin-top: 8px;
    font-size: 0.78rem;
    color: var(--gris-texte);
  }
  .suggestions {
    max-width: 720px;
    width: 100%;
    margin: 0 auto 12px;
    padding: 0 24px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .suggestion {
    background: var(--carte);
    border: 1px solid var(--ligne);
    color: var(--texte);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .suggestion:hover { border-color: var(--menthe); color: var(--menthe-sombre); }
  form {
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: 16px 24px 24px;
    display: flex;
    gap: 10px;
  }
  input {
    flex: 1;
    background: var(--carte);
    border: 1px solid var(--ligne);
    color: var(--texte);
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 0.95rem;
    font-family: inherit;
  }
  input::placeholder { color: var(--gris-texte); }
  input:focus { outline: none; border-color: var(--menthe); }
  button {
    background: var(--menthe);
    color: #FFFFFF;
    border: none;
    padding: 0 22px;
    border-radius: 12px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--menthe-sombre); }
  button:disabled { opacity: 0.5; cursor: default; }
  .chargement {
    align-self: flex-start;
    color: var(--gris-texte);
    font-size: 0.9rem;
    padding: 12px 16px;
  }
</style>
</head>
<body>

<header>
  <h1>Cabinet <span>Belle Sourire</span> · Assistant</h1>
  <p>Horaires, prestations, tarifs — posez votre question.</p>
</header>

<div id="fil"></div>

<div class="suggestions" id="suggestions">
  <div class="suggestion">Quels sont vos horaires d'ouverture ?</div>
  <div class="suggestion">Combien coûte un détartrage ?</div>
  <div class="suggestion">Comment annuler un rendez-vous ?</div>
</div>

<form id="formulaire">
  <input id="saisie" type="text" placeholder="Votre question..." autocomplete="off" />
  <button type="submit">Envoyer</button>
</form>

<script>
const fil = document.getElementById('fil');
const formulaire = document.getElementById('formulaire');
const saisie = document.getElementById('saisie');
const suggestions = document.getElementById('suggestions');
let historique = [];

function ajouterBulle(role, texte, sources) {
  const bulle = document.createElement('div');
  bulle.className = 'bulle ' + (role === 'user' ? 'utilisateur' : 'assistant');
  bulle.textContent = texte;
  if (sources) {
    const s = document.createElement('span');
    s.className = 'sources';
    s.textContent = '📎 ' + sources;
    bulle.appendChild(s);
  }
  fil.appendChild(bulle);
  fil.scrollTop = fil.scrollHeight;
  return bulle;
}

async function envoyer(message) {
  suggestions.style.display = 'none';
  ajouterBulle('user', message);
  historique.push({ role: 'user', content: message });

  const chargement = document.createElement('div');
  chargement.className = 'chargement';
  chargement.textContent = 'L\'assistant réfléchit...';
  fil.appendChild(chargement);
  fil.scrollTop = fil.scrollHeight;

  saisie.value = '';
  saisie.disabled = true;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, history: historique.slice(0, -1) })
    });
    const data = await res.json();
    chargement.remove();
    ajouterBulle('assistant', data.response, data.sources);
    historique.push({ role: 'assistant', content: data.response });
  } catch (e) {
    chargement.remove();
    ajouterBulle('assistant', "Une erreur est survenue, réessayez dans un instant.");
  } finally {
    saisie.disabled = false;
    saisie.focus();
  }
}

formulaire.addEventListener('submit', (e) => {
  e.preventDefault();
  const message = saisie.value.trim();
  if (message) envoyer(message);
});

document.querySelectorAll('.suggestion').forEach(el => {
  el.addEventListener('click', () => envoyer(el.textContent));
});
</script>

</body>
</html>
